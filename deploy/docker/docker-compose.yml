# ============================================================
# 数桥 DBridge · Docker Compose
# ============================================================
# 用法：docker compose up -d
# 浏览器打开 http://localhost:27301
#
# 关键点：
#   - data 卷持久化（授权文件 + H2 库 + 时间锚点），容器重建不掉授权
#   - 授权云端地址通过 DBRIDGE_LICENSE_URL 环境变量传入
#   - 连宿主机上的数据库时，用 host.docker.internal（见下方注释）
# ============================================================

services:
  dbridge:
    build: .
    image: dbridge:1.0.8
    container_name: dbridge
    restart: unless-stopped
    ports:
      - "27301:27301"
    environment:
      # 授权云端地址（你的授权服务器）。留空则用镜像默认 127.0.0.1:27302
      # 生产地址固定带 27302 端口：443 已让给软件官网，授权只走 27302
      DBRIDGE_LICENSE_URL: "https://dbridge.zzzmxxkj.com:27302"
      # 同步引擎目录（镜像内固定路径，无需改动；见 Dockerfile 的 ENV）
      DBRIDGE_ENGINE_HOME: "/opt/dbridge/engine"
      SEATUNNEL_HOME: "/opt/dbridge/engine"
      # 首次登录的出厂密码（可选，不设则默认 admin123，登录后强制改密）
      # DBRIDGE_ADMIN_PASSWORD: "ChangeMe123456"
      # 时区（影响日志时间戳与 cron 调度）
      TZ: "Asia/Shanghai"
    volumes:
      # 数据卷：授权文件、H2 库、时间锚点都在这里，务必持久化
      - dbridge-data:/opt/dbridge/data
      # 日志挂出来方便排障（可选）
      - dbridge-logs:/opt/dbridge/logs
      # ★ 关键：挂载宿主机 machine-id，作为设备指纹「os」因子的稳定锚点
      #   云服务器/虚拟机读不到主板 UUID 时，靠它保证授权不掉（Red Hat 官方镜像同款做法）
      - /etc/machine-id:/etc/machine-id:ro
    # 连宿主机上的数据库（比如宿主机本机装的 MySQL）时，打开下面这行：
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

volumes:
  dbridge-data:
  dbridge-logs:
