# ============================================================
# 数桥 DBridge · Docker Compose
# ============================================================
# 用法：docker compose up -d
# 浏览器打开 http://localhost:27301
#
# 关键点：
#   - data 卷持久化（程序数据与授权信息），容器重建不掉授权
#   - 授权云端地址通过 DBRIDGE_LICENSE_URL 环境变量传入
#   - 连宿主机上的数据库时，用 host.docker.internal（见下方注释）
# ============================================================

services:
  dbridge:
    # 镜像通过一键安装脚本获取（install.sh）；本地已有 dbridge 镜像时可直接 up
    image: dbridge:latest
    container_name: dbridge
    restart: unless-stopped
    ports:
      - "27301:27301"
    environment:
      # 授权服务地址（必须带 27302 端口，443 用于官网）
      DBRIDGE_LICENSE_URL: "https://dbridge.zzzmxxkj.com:27302"
      # 首次登录的出厂密码（可选，不设则默认 admin123，登录后引导改密）
      # DBRIDGE_ADMIN_PASSWORD: "ChangeMe123456"
      # 时区（影响日志时间与定时任务触发时刻）
      TZ: "Asia/Shanghai"
    volumes:
      # 数据卷：程序数据与授权信息都在这里，务必持久化
      - dbridge-data:/opt/dbridge/data
      # 日志挂出来方便排障（可选）
      - dbridge-logs:/opt/dbridge/logs
      # 挂载宿主机 machine-id：云服务器上保证授权指纹稳定，容器重建不掉授权
      - /etc/machine-id:/etc/machine-id:ro
    # 连宿主机上的数据库（比如宿主机本机装的 MySQL）时，打开下面这行：
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

volumes:
  dbridge-data:
  dbridge-logs:
